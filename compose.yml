services:
  hub:
    build: .
    image: sensmos-hub:0.1
    pull_policy: build
    container_name: sensmos-hub
    # host networking: the phone finds the hub by mDNS and pairs over LAN (port 80, like an ESP32 node), the tunnel reaches LAN devices,
    # and `ping` measures the real home link, not Docker's bridge.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
