name: test
# Każdy push i PR: testy protokołu, LAN, HA oraz poprawność YAML dodatków (Supervisor odrzuca zepsuty YAML po cichu).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
        env:
          SENSMOS_WEKTORY: ${{ github.workspace }}/wektory
