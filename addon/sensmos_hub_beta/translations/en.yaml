configuration:
  owner:
    name: Wallet address (optional)
    description: >-
      Leave empty and add the hub from the Sensmos app (Nodes → Add → Search the network, PIN from the
      Home Assistant notification): the app assigns it to your wallet. Or paste your wallet address
      (Wallet screen, starts with 0x). The node is registered to this wallet and its GALU allocations go there.
  pin:
    name: PIN
    description: >-
      Six digits the app asks for when you pair the phone with this node. Leave empty and a random PIN
      is written to the add-on log.
  port:
    name: LAN port
    description: Port the app talks to on your network. Keep 80 unless another add-on uses it.
  lora_key:
    name: LoRa key phrase
    description: >-
      The same phrase you set in your LoRa sensors. The hub decrypts their frames with it and shows them
      as sensor.sensmos_lora_* entities. Optional: you can also set it in the app (hub card → LoRa).
  lorawan_forward:
    name: LoRaWAN forward (host:port)
    description: >-
      Optional. Your ChirpStack Gateway Bridge or The Things Stack, e.g. 192.168.1.10:1700. The hub forwards to it the LoRaWAN frames with the addresses below, like a gateway (uplink only).
  lorawan_devaddr:
    name: LoRaWAN DevAddr
    description: >-
      Optional. Addresses of your ABP sensors, comma separated, e.g. 26011A2B. Only frames with these addresses reach the hub.
