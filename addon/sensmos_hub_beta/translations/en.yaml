configuration:
  owner:
    name: Wallet address
    description: >-
      Your wallet address from the Sensmos app (Wallet screen, starts with 0x). The node is registered
      to this wallet and its rewards go there.
  pin:
    name: PIN
    description: >-
      Six digits the app asks for when you pair the phone with this node. Leave empty and a random PIN
      is written to the add-on log.
  port:
    name: LAN port
    description: Port the app talks to on your network. Keep 80 unless another add-on uses it.
  lora_key:
    name: LoRa key phrase
    description: >-
      The same phrase you set in your LoRa sensors. The hub decrypts their frames with it and shows them
      as sensor.sensmos_lora_* entities. Optional: you can also set it in the app (hub card → LoRa).
