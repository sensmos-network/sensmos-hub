configuration:
  owner:
    name: Adres portfela (opcjonalnie)
    description: >-
      Zostaw puste i dodaj Huba z apki Sensmos (Nody → Dodaj → Szukaj w sieci, PIN z powiadomienia
      w Home Assistancie): apka sama przypisze go do Twojego portfela. Albo wklej adres portfela
      (ekran Portfel, zaczyna się od 0x). Nod rejestruje się na ten portfel i tam trafia przydział GALU.
  pin:
    name: PIN
    description: >-
      Sześć cyfr, o które apka pyta przy parowaniu telefonu z tym nodem. Puste pole = losowy PIN
      w logu dodatku.
  port:
    name: Port w sieci lokalnej
    description: Port, na którym apka łączy się z nodem. Zostaw 80, chyba że zajmuje go inny dodatek.
  lora_key:
    name: Fraza klucza LoRa
    description: >-
      Ta sama fraza, którą ustawiasz w czujnikach LoRa. Hub odszyfrowuje nią ich ramki i pokazuje je
      jako encje sensor.sensmos_lora_*. Opcjonalnie: można ją też ustawić w apce (karta Huba → LoRa).
  lorawan_forward:
    name: Przekazywanie LoRaWAN (host:port)
    description: >-
      Opcjonalnie. Twój ChirpStack Gateway Bridge albo The Things Stack, np. 192.168.1.10:1700. Hub przekazuje tam ramki LoRaWAN z adresami poniżej, jak brama (tylko uplink).
  lorawan_devaddr:
    name: DevAddr LoRaWAN
    description: >-
      Opcjonalnie. Adresy Twoich czujników ABP po przecinku, np. 26011A2B. Do Huba trafiają tylko ramki z tymi adresami.
