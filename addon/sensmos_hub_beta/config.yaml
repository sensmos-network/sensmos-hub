name: Sensmos Hub (beta)
version: "0.1.2-beta1"
slug: sensmos_hub_beta
description: Test builds of Sensmos Hub for the testers programme. Gets new hub versions before the stable add-on. Runs as a separate node: stop the stable add-on first.
url: https://github.com/sensmos-network/sensmos-hub
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
init: false
options:
  owner: ""
  pin: ""
  port: 80
schema:
  owner: match(^0x[0-9a-fA-F]{40}$)
  pin: match(^[0-9]{6}$)?
  port: port
