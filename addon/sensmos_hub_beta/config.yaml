name: Sensmos Hub (beta)
version: "0.2.0-beta2"
slug: sensmos_hub_beta
description: "Test builds of Sensmos Hub for the testers programme. Gets new hub versions before the stable add-on. Runs as a separate node: stop the stable add-on first."
url: https://github.com/sensmos-network/sensmos-hub
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
# czujniki z HA (odczyt stanów, src/ha.js) i zapis czujników LoRa sensor.sensmos_lora_* (src/ha_lora.js) przez API Supervisora
homeassistant_api: true
init: false
options:
  owner: ""
  pin: ""
  port: 80
  lora_key: ""
schema:
  owner: match(^0x[0-9a-fA-F]{40}$)
  pin: match(^[0-9]{6}$)?
  port: port
  lora_key: password?
