name: Sensmos Hub
version: "0.1.0"
slug: sensmos_hub
description: A Sensmos node without an ESP32. Pairs with the Sensmos app over LAN and opens the encrypted tunnel to this Home Assistant.
url: https://github.com/sensmos-network/sensmos-hub
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
init: false
options:
  owner: ""
  pin: ""
  port: 8080
schema:
  owner: match(^0x[0-9a-fA-F]{40}$)
  pin: match(^[0-9]{6}$)?
  port: port
