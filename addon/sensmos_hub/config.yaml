name: Sensmos Hub
version: "0.2.0"
slug: sensmos_hub
description: "A Sensmos node without an ESP32. Pairs with the Sensmos app over LAN, opens the encrypted tunnel to this Home Assistant and receives your LoRa sensors through the network."
url: https://github.com/sensmos-network/sensmos-hub
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
# czujniki z HA (odczyt stanów, src/ha.js) i zapis czujników LoRa sensor.sensmos_lora_* (src/ha_lora.js) przez API Supervisora
homeassistant_api: true
init: false
options:
  owner: ""
  pin: ""
  port: 80
  lora_key: ""
  lorawan_forward: ""
  lorawan_devaddr: ""
  esphome_lora: ""
  meshtastic_track: ""
  outdoor_sensors: ""
schema:
  owner: match(^0x[0-9a-fA-F]{40}$)?
  pin: match(^[0-9]{6}$)?
  port: port
  lora_key: password?
  lorawan_forward: str?
  lorawan_devaddr: str?
  esphome_lora: password?
  meshtastic_track: str?
  outdoor_sensors: str?
